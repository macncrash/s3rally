# Builds the game natively (and runs the headless race test), then builds the
# WebAssembly version and publishes it to GitHub Pages.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: make -j4
      - run: ./s3 --version
      - run: ./s3 --sim
      - run: ./s3 --versus-test 0 --players 4
      - run: ./s3 --versus-test 7 --players 3 --discover
      - run: ./s3 --versus-test 0 --discover --cart run
      - run: ./s3 --versus-test 2 --cart run
      - run: ./s3 --versus-test 1 --players 4 --cart run
      - run: ./s3 --versus-test 3 --players 4 --discover --cart run
      - run: ./s3 --replay-test

  scoreboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: cd server && cargo test
      - run: ./tools/score-test.sh
      - run: docker build -f server/Dockerfile --build-arg BUILD_ID=${GITHUB_SHA::7} -t s3-scores:ci .
      - name: the image serves and its verifier runs
        run: |
          docker run -d --name s3 --read-only --tmpfs /tmp --cap-drop ALL -p 127.0.0.1:18790:8790 s3-scores:ci
          for i in $(seq 30); do curl -fs http://127.0.0.1:18790/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:18790/v1/stats | grep -q '"game":"rally"'
          # A replay recorded by this build, checked by the image's verifier (a different compiler):
          # accepted, or at worst review for last-bit float differences; never rejected.
          ./s3 --write-replay 0 /tmp/r.bin
          set +e
          docker run --rm -v /tmp/r.bin:/r.bin:ro s3-scores:ci /app/s3 --verify-run /r.bin
          code=$?
          set -e
          test $code -le 1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - run: make web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-web

  deploy:
    needs: [native, web, scoreboard]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
