# Builds the game natively (and runs the headless race test), then builds the
# WebAssembly version and publishes it to GitHub Pages.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: make -j4
      - run: ./s3 --version
      - run: ./s3 --sim
      - run: ./s3 --versus-test 0 --discover
      - run: ./s3 --versus-test 2
      - run: ./s3 --versus-test 1 --players 4
      - run: ./s3 --versus-test 3 --players 4 --discover

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - run: make web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-web

  deploy:
    needs: [native, web]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
