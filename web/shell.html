<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>(3) RALLY</title>
<style>
  :root { --bg: #0d0e14; --panel: #171924; --line: #2a2d3d; --ink: #e9e9f0; --dim: #9a9cb0; --sun: #ffc21a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 ui-monospace, Menlo, monospace; }
  body { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }
  .screen { position: relative; width: min(100%, calc((100vh - 120px) * 4 / 3), 1280px); aspect-ratio: 4 / 3; background: #000;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  canvas { display: block; width: 100% !important; height: 100% !important; outline: none; image-rendering: pixelated; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: rgba(0,0,0,.78); cursor: pointer; text-align: center; }
  .overlay b { font-size: 26px; letter-spacing: 6px; color: var(--sun); }
  .overlay span { color: var(--dim); }
  .keys { color: var(--dim); text-align: center; max-width: 960px; }
  kbd { background: #2d2e35; border: 1px solid #40414a; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink); }
  a { color: var(--sun); }
</style>
</head>
<body>
  <div class="screen">
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div class="overlay" id="overlay">
      <b id="status">LOADING…</b>
      <span id="hint">downloading the cartridge</span>
    </div>
  </div>
  <div class="keys">
    <kbd>←</kbd><kbd>→</kbd> steer · <kbd>C</kbd>/<kbd>↑</kbd> accelerate · <kbd>X</kbd>/<kbd>↓</kbd> brake ·
    <kbd>Space</kbd> handbrake · <kbd>Q</kbd>/<kbd>W</kbd> gears · <kbd>V</kbd> view · <kbd>Tab</kbd> radio ·
    <kbd>Enter</kbd> start/pause · <kbd>Esc</kbd> back (on a title screen: pick another game) · <kbd>F11</kbd> fullscreen · gamepads work too
    <br><a href="https://github.com/macncrash/s3garally">source on GitHub</a>
  </div>
<script>
  const overlay = document.getElementById('overlay');
  const statusEl = document.getElementById('status');
  const hint = document.getElementById('hint');
  const canvas = document.getElementById('canvas');
  // Keep the browser from scrolling or moving focus on game keys.
  const gameKeys = new Set(['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Backspace']);
  window.addEventListener('keydown', (e) => { if (gameKeys.has(e.code)) e.preventDefault(); });
  // ?cart=rally32 (or run, rally) opens that game directly, skipping the multi-cart menu.
  const wantCart = new URLSearchParams(location.search).get('cart');
  var Module = {
    arguments: wantCart && /^[a-z0-9]+$/.test(wantCart) ? ['--cart', wantCart] : [],
    canvas,
    print: (t) => console.log(t),
    printErr: (t) => console.warn(t),
    setStatus: (t) => { if (t) hint.textContent = t.replace(/\(.*\)/, ''); },
    onRuntimeInitialized: () => {
      statusEl.textContent = 'CLICK TO PLAY';
      hint.textContent = 'sound starts on click';
      overlay.addEventListener('click', () => { overlay.style.display = 'none'; canvas.focus(); }, { once: true });
    },
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
